<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover — standalone-ում էջը հասնում է iPhone-ի notch-ի տակ,
         safe-area-inset-*-ը app.css-ն է կարգավորում։ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gialora — Mediterranean meals, planned</title>
    <meta name="description" content="Tell Gialora about your family and it will plan the week, keep meals varied and turn it all into one consolidated shopping list." />
    <base href="/" />

    <!-- Տառատեսակներ. Inter + Noto Serif Display-ը ծածկում են լատիներեն և հունարեն,
         Noto * Armenian-ը՝ հայերենը։ Google-ի CSS-ը unicode-range-ով է, ուստի
         հայերեն ֆայլերը ներբեռնվում են միայն հայերեն տեքստ երևալիս։
         display=swap — մինչ բեռնվելը տեքստը երևում է system font-ով։ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600;700&family=Noto+Serif+Display:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+Armenian:wght@500;600&display=swap" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Gialora.Client.styles.css" rel="stylesheet" />

    <!-- PWA։ սրանցով է browser-ը առաջարկում "Տեղադրել հավելվածը"։ -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#5c6f47" />

    <!-- iOS-ը manifest-ի display/icons-ը լիարժեք չի կարդում — իրենն առանձին է ուզում։ -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gialora" />

    <!-- Splash-ի CSS-ը inline է, որ առաջին frame-ից երևա՝ bootstrap/app.css-ին չսպասելով։ -->
    <style>
        html, body { margin: 0; background: #f6f1e7; }
        .app-splash {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1rem; background: #f6f1e7;
        }
        .app-splash img { border-radius: 22px; box-shadow: 0 2px 6px rgba(44,42,38,.07), 0 12px 28px rgba(44,42,38,.09); }
        .app-splash-name {
            font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
            font-size: 1.75rem; color: #43522f; letter-spacing: .02em;
        }
        .app-splash-bar { width: 120px; height: 3px; border-radius: 3px; background: #ece3d2; overflow: hidden; }
        .app-splash-bar span {
            display: block; width: 40%; height: 100%; border-radius: 3px; background: #5c6f47;
            animation: app-splash-slide 1.1s ease-in-out infinite;
        }
        @keyframes app-splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { .app-splash-bar span { animation: none; width: 100%; } }
    </style>
</head>

<body>
    <!-- Splash. Blazor-ը #app-ի պարունակությունը փոխարինում է առաջին render-ին։
         Տոկոսային շրջանակի փոխարեն՝ լոգո, որ բացումը "հավելվածի" զգացողություն տա։ -->
    <div id="app">
        <div class="app-splash" aria-label="Gialora" role="status">
            <img src="icon-192.png" width="96" height="96" alt="" />
            <div class="app-splash-name">Gialora</div>
            <div class="app-splash-bar"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // Ֆայլի ներբեռնումը (CSV template) զուտ browser-ի գործ է — Blazor-ից
        // անելը կպահանջեր base64-ի միջով ամբողջ ֆայլը JS interop-ով անցկացնել։
        window.gialoraDownload = (fileName, contentType, content) => {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();

            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        // Chat-ի նոր հաղորդագրությունը պիտի երևա — Blazor-ը scroll-ի API չունի
        window.gialoraChat = {
            scrollToBottom: el => { if (el) el.scrollTop = el.scrollHeight; },
            // Թաքնված tab-ում polling-ը իմաստ չունի (մարտկոց, server-ի բեռ)
            isHidden: () => document.hidden
        };

        // <html lang>-ը լեզվի փոփոխության ժամանակ (screen reader-ներ, տառատեսակներ)։
        // Առանձին ֆունկցիա, ոչ թե eval — eval-ը կարգելեր Content-Security-Policy-ն առանց 'unsafe-eval'-ի։
        window.gialoraSetLang = lang => { document.documentElement.lang = lang; };

        // Admin-ի վիճակագրությունը. ՄԵԿ listener ամբողջ document-ի վրա, որ ամեն
        // կոճակին առանձին @onclick կցելու կարիք չլինի։ Համաձայնությունը (cookie
        // "Accept all") ստուգում է .NET-ի ActivityTracker-ը, ոչ թե այստեղ։
        //
        // Կոճակի անունը՝ ըստ առաջնահերթության.
        //   data-track="..."      — բացահայտ, լեզվից անկախ անուն (խորհուրդ է տրվում կարևոր կոճակներին)
        //   <a href>              — "link:/recipes/..." (path-ը լեզվից անկախ է)
        //   <button>              — aria-label / title / տեքստը (ընթացիկ լեզվով)
        // data-track-ignore-ով տարրերը (և ներսի ամեն ինչ) չեն հաշվվում։
        // Input-ների ԱՐԺԵՔՆԵՐԸ երբեք չենք կարդում։
        window.gialoraActivity = (() => {
            let listener = null;   // ActivityTrackerHost.razor-ի հղումը

            const clean = text => (text || '').replace(/\s+/g, ' ').trim().slice(0, 120) || null;

            const labelOf = el => {
                const tracked = el.closest('[data-track]');
                if (tracked) return clean(tracked.getAttribute('data-track'));

                const link = el.closest('a[href]');
                if (link) {
                    try {
                        const url = new URL(link.href, location.href);
                        return 'link:' + (url.origin === location.origin ? url.pathname : url.host);
                    } catch { return null; }
                }

                const button = el.closest('button, [role="button"], input[type="submit"], input[type="button"]');
                if (button)
                    return clean(button.getAttribute('aria-label') || button.title || button.innerText || button.value);

                return null;
            };

            // capture — որ stopPropagation անող բաղադրիչներն էլ հաշվվեն
            document.addEventListener('click', e => {
                if (!listener || !(e.target instanceof Element)) return;
                if (e.target.closest('[data-track-ignore]')) return;

                const label = labelOf(e.target);
                if (label) listener.invokeMethodAsync('OnClick', label, location.pathname);
            }, { capture: true });

            // Tab-ը փակելիս / թաքցնելիս հերթը ուղարկում ենք, որ վերջին click-երը չկորչեն
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') listener?.invokeMethodAsync('OnHidden');
            });

            return {
                setListener(dotNetRef) { listener = dotNetRef; },
                clearListener() { listener = null; }
            };
        })();
    </script>

    <script>
        // PWA-ի ՏԵՂԱԴՐՈՒՄԸ։ Browser-ի "beforeinstallprompt"-ը բռնում ենք, որ
        // հավելվածն ունենա ԻՐ "Տեղադրել" կոճակը (PwaInstallPrompt.razor), ոչ թե
        // սպասի browser-ի թաքուն menu-ին։ iOS Safari-ն այս event-ը չունի — այնտեղ
        // ցույց ենք տալիս "Share → Add to Home Screen" հուշումը։
        //
        // ՈՒՇԱԴՐՈՒԹՅՈՒՆ. event-ը կարող է հնչել դեռ Blazor-ի բեռնվելուց ԱՌԱՋ, ուստի
        // listener-ը գրանցում ենք հիմա և deferred prompt-ը պահում, մինչև .NET-ը գա։
        window.gialoraInstall = (() => {
            let deferred = null;     // բռնված beforeinstallprompt event-ը
            let listener = null;     // PwaInstallPrompt.razor-ի հղումը

            const isStandalone = () =>
                window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;   // iOS-ի դրոշը

            const isIos = () => {
                const ua = window.navigator.userAgent;
                const ios = /iphone|ipad|ipod/i.test(ua)
                    || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPadOS 13+
                // Միայն Safari-ն; Chrome/Firefox iOS-ում "Add to Home Screen" չունեն
                const safari = /safari/i.test(ua) && !/crios|fxios|edgios/i.test(ua);
                return ios && safari;
            };

            const notify = () => listener?.invokeMethodAsync('OnStateChanged');

            window.addEventListener('beforeinstallprompt', e => {
                e.preventDefault();   // browser-ի ինքնաշխատ banner-ը չցուցադրվի
                deferred = e;
                notify();
            });

            window.addEventListener('appinstalled', () => {
                deferred = null;      // տեղադրվեց — կոճակը թաքցնում ենք
                notify();
            });

            return {
                setListener(dotNetRef) {
                    listener = dotNetRef;
                    notify();         // արդեն բռնած prompt-ի դեպքում՝ անմիջապես ցույց
                },
                clearListener() { listener = null; },
                getState() {
                    return {
                        canInstall: deferred !== null,
                        isIos: isIos(),
                        isStandalone: isStandalone()
                    };
                },
                async prompt() {
                    if (!deferred) return 'unavailable';
                    deferred.prompt();
                    const choice = await deferred.userChoice;
                    deferred = null;  // ըստ ստանդարտի՝ event-ը մեկանգամյա է
                    notify();
                    return choice.outcome;   // 'accepted' | 'dismissed'
                }
            };
        })();
    </script>

    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        // PWA-ի կառավարումը։ Նոր service worker-ը ըստ ստանդարտի սպասում է, մինչև
        // հավելվածի ԲՈԼՈՐ պատուհանները փակվեն։ Տեղադրված հավելվածը մարդիկ երբեք
        // չեն փակում, ուստի առանց այս հուշման օգտատերը կմնար հին տարբերակի վրա։
        window.gialoraPwa = (() => {
            let waiting = null;      // թարմացված, բայց դեռ չակտիվացած worker-ը
            let listener = null;     // PwaUpdatePrompt.razor-ի հղումը

            const announce = worker => {
                waiting = worker;
                listener?.invokeMethodAsync('OnUpdateReady');
            };

            const watch = registration => {
                // controller-ի առկայությունը նշանակում է, որ սա ԱՌԱՋԻՆ տեղադրումը չէ,
                // այլ թարմացում — առաջին անգամ հուշում ցույց տալը անիմաստ կլիներ։
                if (registration.waiting && navigator.serviceWorker.controller)
                    announce(registration.waiting);

                // Browser-ը service-worker.js-ը նորից ստուգում է միայն իրական navigation-ի
                // ժամանակ, իսկ Blazor-ի routing-ը navigation չէ, և տեղադրված հավելվածը չեն
                // փակում — առանց սրա "նոր տարբերակ" հուշումը երբեք չէր հայտնվի։
                const checkForUpdate = () => registration.update().catch(() => { /* offline */ });
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') checkForUpdate();
                });
                setInterval(checkForUpdate, 60 * 60 * 1000);

                registration.addEventListener('updatefound', () => {
                    const installing = registration.installing;
                    if (!installing) return;

                    installing.addEventListener('statechange', () => {
                        if (installing.state === 'installed' && navigator.serviceWorker.controller)
                            announce(installing);
                    });
                });
            };

            if ('serviceWorker' in navigator) {
                // load-ից հետո, որ precache-ի ներբեռնումը չմրցի առաջին render-ի հետ։
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('service-worker.js')
                        .then(watch)
                        .catch(err => {
                            // http://, private mode, արգելափակված storage — հավելվածը
                            // պարզապես շարունակում է աշխատել սովորական կայքի պես։
                            console.warn('Gialora: service worker registration failed.', err);
                        });
                });
            }

            return {
                setListener(dotNetRef) {
                    listener = dotNetRef;
                    if (waiting) dotNetRef.invokeMethodAsync('OnUpdateReady');
                },
                clearListener() {
                    listener = null;
                },
                apply() {
                    if (!waiting) { location.reload(); return; }

                    // Վերաբեռնում ենք միայն նոր worker-ի ղեկը վերցնելուց ՀԵՏՈ,
                    // այլապես էջը նորից հին cache-ից կբացվեր։
                    navigator.serviceWorker.addEventListener(
                        'controllerchange', () => location.reload(), { once: true });

                    waiting.postMessage({ type: 'SKIP_WAITING' });
                }
            };
        })();
    </script>
</body>

</html>
